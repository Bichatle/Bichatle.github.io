<!DOCTYPE html><html lang="tr"><head>
<script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCPFoDDq3tdZ9Tu5jkv4DYD_RsG5aad5lU",
  authDomain: "bichatle.firebaseapp.com",
  projectId: "bichatle",
  storageBucket: "bichatle.firebasestorage.app",
  messagingSenderId: "931905496213",
  appId: "1:931905496213:web:e89a4e217eed5cb57e279c",
  measurementId: "G-JCMYMNM0C2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();
const bclEmail=n=>`${n}@bichatle.app`;
async function bclUserDoc(n){const d=await db.collection('users').doc(n).get();return d.exists?d.data():null}
async function bclSaveUser(n,data){await db.collection('users').doc(n).set(data,{merge:true});S.users[n]=Object.assign({},S.users[n]||{},data);save()}
async function bclLoadMe(n){const d=await bclUserDoc(n);if(!d)throw new Error('Kullanıcı profili bulunamadı');S.users[n]=d;S.me=n;S.locked=false;save();}
let bclMeUnsub=null;
async function bclSyncFriends(){if(!S.me)return;try{const me=await bclUserDoc(S.me);if(!me)return;S.users[S.me]=me;for(const f of (me.friends||[])){const fd=await bclUserDoc(f);if(fd)S.users[f]=fd;}save();paint();}catch(e){console.error('Arkadaş senkronizasyonu:',e)}}
function bclWatchMe(n){if(bclMeUnsub){bclMeUnsub();bclMeUnsub=null;}bclMeUnsub=db.collection('users').doc(n).onSnapshot(async d=>{if(!d.exists)return;S.users[n]=d.data();S.me=n;S.locked=false;save();await bclSyncFriends();});}
let bclChatUnsub=null,bclChatKey=null;
function bclStopChatWatch(){if(bclChatUnsub){bclChatUnsub();bclChatUnsub=null;}bclChatKey=null;}
async function bclUploadChatMedia(value,chatId,messageId,field){
 if(typeof value!=='string'||!value.startsWith('data:'))return value;
 const blob=await (await fetch(value)).blob();
 const ext=(blob.type.split('/')[1]||'bin').split(';')[0].replace(/[^a-z0-9]/gi,'')||'bin';
 const ref=storage.ref().child('chatMedia/'+chatId+'/'+messageId+'_'+field+'.'+ext);
 await ref.put(blob);
 return await ref.getDownloadURL();
}
async function bclPrepareChatMessage(message,chatId){
 const out=Object.assign({},message);
 for(const field of ['img','vid','au'])if(out[field])out[field]=await bclUploadChatMedia(out[field],chatId,String(out.id),field);
 return out;
}
async function bclWatchChat(other){
 if(!S.me||!other||!auth.currentUser)return;
 const chatId=key(S.me,other);
 if(bclChatKey===chatId)return;
 bclStopChatWatch();bclChatKey=chatId;
 try{
  const root=db.collection('chats').doc(chatId);
  await root.set({members:[bclEmail(S.me),bclEmail(other)].sort(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  const col=root.collection('messages');
  // Bu cihazdaki eski yerel mesajları, aynı belge kimliğiyle yalnızca bir kez buluta aktar.
  const legacy=(S.chats[chatId]||[]).slice();
  for(const old of legacy){
   if(!old||!old.id)continue;
   const doc=col.doc(String(old.id).replace(/\//g,'_'));
   const exists=await doc.get();
   if(!exists.exists){
    const prepared=await bclPrepareChatMessage(old,chatId);
    await doc.set(prepared);
   }
  }
  if(bclChatKey!==chatId||peer!==other||view!=='chat'){if(bclChatKey===chatId)bclChatKey=null;return;}
  bclChatUnsub=col.orderBy('t','asc').limit(500).onSnapshot(snapshot=>{
   if(bclChatKey!==chatId)return;
   S.chats[chatId]=snapshot.docs.map(d=>Object.assign({id:d.id},d.data()));
   save();
   if(view==='chat'&&peer===other){paint();incoming();}
  },e=>{console.error('Sohbet dinleme hatası:',e);err='Mesajlar alınamadı: '+(e.message||'Firebase bağlantısını kontrol edin');});
 }catch(e){
  console.error('Sohbet senkronizasyonu:',e);
  if(bclChatKey===chatId)bclChatKey=null;
  err='Sohbet Firebase’e bağlanamadı: '+(e.message||'Bağlantıyı kontrol edin');
  if(view==='chat'&&peer===other)paint();
 }
}

async function bclSetAvatar(av){if(!S.me)return;try{await db.collection('users').doc(S.me).set({av},{merge:true});}catch(e){err='Avatar kaydedilemedi';paint()}}
async function bclSetNick(friend,nick){if(!S.me)return;try{const u=S.users[S.me]||{};const nicks=Object.assign({},u.nick||{});if(nick)nicks[friend]=nick;else delete nicks[friend];await db.collection('users').doc(S.me).set({nick:nicks},{merge:true});}catch(e){err='Rumuz kaydedilemedi';paint()}}
</script>

<style>
:root{--c:#1976d2;--bg:#fff;--tx:#111;--card:#f2f5fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);background-image:repeating-linear-gradient(45deg,transparent 0 14px,rgba(128,128,128,.08) 14px 16px)}
h1.logo{font-family:'Pacifico',cursive;font-style:italic;font-weight:700;margin:0;color:#2b2b2b;background:#fff;font-size:34px;text-align:center;position:relative;padding:12px 46px;border-radius:0;box-shadow:none;text-shadow:2px 2px 0 #0002;letter-spacing:.5px;white-space:nowrap}
.sp{position:absolute;width:2px;height:2px;border-radius:50%;pointer-events:none;background:#fff176;animation:sb .8s ease-out forwards}
@keyframes sb{0%{transform:translate(0,0) scale(1);background:#fff59d;box-shadow:0 0 4px 1px #ffeb3b;opacity:1}25%{background:#ffb300;box-shadow:0 0 4px 1px #ff9800}50%{background:#ff5722;box-shadow:0 0 3px 0 #e53935;transform:translate(calc(var(--dx)*.8),calc(var(--dy)*.8 + 4px)) scale(.8)}75%{background:#757575;box-shadow:none;opacity:.8}100%{transform:translate(var(--dx),calc(var(--dy) + 10px)) scale(.3);background:#212121;box-shadow:none;opacity:0}}
.st{display:none;position:absolute;pointer-events:none;color:var(--k);font-size:15px;font-style:normal;text-shadow:none;animation:stw .85s ease-out forwards}
@keyframes stw{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.3) rotate(45deg);opacity:1}100%{transform:scale(0) rotate(90deg);opacity:0}}
.sq{display:none!important;position:absolute;pointer-events:none;font-style:normal;line-height:0;opacity:0;animation:wv 3s ease-in-out infinite alternate}
@keyframes wv{0%{opacity:0;transform:translate(0,0) rotate(var(--a))}50%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--a2))}}
.ring{display:none!important;position:absolute;left:0;top:0;pointer-events:none;overflow:visible;animation:rv 7s ease-in-out infinite}
.ring rect{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round;animation:rd 3s linear infinite}
@keyframes rd{to{stroke-dashoffset:-39}}@keyframes rv{0%,55%{opacity:0}70%,85%{opacity:.9}100%{opacity:0}}
.box h1.logo{margin:-16px -16px 14px;border-bottom:4px solid var(--c)}
.lock h1.logo{margin:-30px -30px 14px}
h1.logo::before,h1.logo::after{display:none!important;position:absolute;top:50%;font-style:normal;font-family:system-ui,sans-serif;font-size:.6em;line-height:1.1;white-space:pre;color:var(--c);text-shadow:none}
h1.logo::before{content:"➜\A➜";left:8px;transform:translateY(-50%);animation:ar1 1.4s ease-in-out infinite alternate}
h1.logo::after{content:"⬅\A⬅";right:8px;transform:translateY(-50%);animation:ar2 1.4s ease-in-out infinite alternate}
@keyframes ar1{to{transform:translate(7px,-50%)}}@keyframes ar2{to{transform:translate(-7px,-50%)}}

@keyframes pu{to{transform:rotate(var(--r)) scale(1.18)}}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cd{display:inline-block;background:#fff;color:#111;border:1px solid #888;border-radius:6px;padding:10px 8px;min-width:44px;margin:3px;text-align:center;font-weight:700}.cd.r{color:#d32f2f}
.bd{display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,420px);margin:auto;border:2px solid #8886}
.dc{aspect-ratio:1;display:grid;place-items:center;border:1px solid #8883}.pc{width:78%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#ffd54f;font-size:16px;box-shadow:0 2px 4px #0005}
.bm{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden}
.bo{font-size:60px;line-height:1;animation:bap 2.7s forwards}
.bi{display:block;animation:trm .05s .7s infinite alternate}
@keyframes bap{0%{transform:scale(.1);opacity:0;animation-timing-function:cubic-bezier(.15,.8,.3,1)}8%{opacity:1}26%{transform:scale(2);animation-timing-function:linear}100%{transform:scale(6)}}
@keyframes trm{from{transform:translate(-7px,3px) rotate(-6deg)}to{transform:translate(7px,-3px) rotate(6deg)}}
.bm .fl{position:absolute;inset:0;background:#fff;animation:fh .7s ease-out forwards}@keyframes fh{from{opacity:.95}to{opacity:0}}
.bm .rg{position:absolute;width:60px;height:60px;border-radius:50%;border:8px solid #ff9800;animation:rgx .9s ease-out forwards}@keyframes rgx{from{transform:scale(.2);opacity:1}to{transform:scale(30);opacity:0}}
.bm .bx{position:absolute;font-size:60px;animation:bxx .9s ease-out forwards}@keyframes bxx{from{transform:scale(.3);opacity:1}70%{opacity:1}to{transform:scale(8);opacity:0}}
.kn{position:fixed;z-index:20;pointer-events:none;width:0;height:0}

@keyframes tp{0%{opacity:0;transform:translateY(60px)}10%{opacity:1;transform:translateY(-25px)}22%{transform:translateY(8px) scale(.92)}34%{transform:translateY(-25px)}46%{transform:translateY(8px) scale(.92)}58%{transform:translateY(-25px)}70%{transform:translateY(8px) scale(.92)}82%{opacity:1;transform:translateY(-25px)}100%{opacity:0;transform:translateY(-60px)}}
@keyframes rp{0%,20%{opacity:0;transform:scale(.2)}22%{opacity:.9;transform:scale(.3)}34%{opacity:0;transform:scale(1.6)}44%{opacity:0}46%{opacity:.9;transform:scale(.3)}58%{opacity:0;transform:scale(1.6)}68%{opacity:0}70%{opacity:.9;transform:scale(.3)}82%,100%{opacity:0;transform:scale(1.6)}}
.m.em{background:transparent!important;color:inherit;font-size:44px;animation:bn 1.2s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-6px) scale(1.15)}}
.fly{position:fixed;bottom:80px;font-size:40px;z-index:8;pointer-events:none;animation:rs 2.4s ease-out forwards}@keyframes rs{to{transform:translateY(-65vh) rotate(40deg);opacity:0}}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #8883}
.av{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px}

<script>
const THEMES={Mavi:'#1976d2',Antrasit:'#37474f',Siyah:'#111111',Pembe:'#e91e8c',Yeşil:'#2e9e5b',Turuncu:'#f57c00',Mor:'#7b1fa2',Kırmızı:'#d32f2f',Turkuaz:'#00acc1',Altın:'#f9a825'};
const AVS=['😀','😎','🦊','🐼','🐱','🦄','🚀','🌸'];
const EM=['😀','😂','😍','😎','😢','👍','🎉','❤️','🔥','🙏'];
const ST=['🐶','🎈','🍕','🌈','💃','⚽'];
let S={};try{S=JSON.parse(localStorage.getItem('bcl')||'{}')}catch(e){}
S.users=S.users||{};S.chats=S.chats||{};S.me=S.me||null;S.theme=S.theme||'Mavi';S.pat=S.pat||'cizgi';S.mode=S.mode||'auto';S.locked=!!S.me;
let view='list',peer=null,menu=false,err='',last=Date.now();
const save=()=>{try{localStorage.setItem('bcl',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const key=(a,b)=>[a,b].sort().join('|');
const okPw=p=>/^[A-Za-z0-9.]{8}$/.test(p)&&/[A-Za-z]/.test(p)&&/[0-9]/.test(p);
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(e){}}
function sweep(){const t=Date.now()-600000;for(const k in S.games||{})if(S.games[k].t<t)delete S.games[k];save()}
function paint(){if(S.me&&!S.users[S.me]){S.me=null;save()}
 document.documentElement.style.setProperty('--c',THEMES[S.theme]||THEMES.Mavi);{const _c=THEMES[S.theme]||'#1976d2',_t=`color-mix(in srgb,${_c} 16%,transparent)`;document.body.style.backgroundImage={cizgi:`repeating-linear-gradient(45deg,transparent 0 14px,${_t} 14px 16px)`,nokta:`radial-gradient(${_t} 2.5px,transparent 3px)`,kare:`linear-gradient(${_t} 1px,transparent 1px),linear-gradient(90deg,${_t} 1px,transparent 1px)`,duz:'none'}[S.pat]||'none';document.body.style.backgroundSize={nokta:'18px 18px',kare:'22px 22px'}[S.pat]||'auto'}
 if(S.mode==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.mode);
 const a=$('#app');
 if(!S.me&&view==='forgot'){forgot();return}
 if(!S.me){
  a.innerHTML=`<div class=box><h1 class=logo>Bi Chat’le</h1>
  <input id=u placeholder="Kullanıcı adı (8-12 karakter)" autocapitalize=off maxlength=12 oninput="this.value=this.value.toLowerCase()"><input id=p type=password placeholder="Şifre (8 hane: harf+sayı, nokta serbest)">
  ${view==='reg'?'<input id=p2 type=password placeholder="Şifre tekrar">':''}
  ${view==='reg'?'<select id=q><option>Annenin kızlık soyadı</option><option>İlkokul adın</option><option>En sevdiğin hayvan</option><option>En sevdiğin renk</option><option>En sevdiğin araba</option></select><input id=an placeholder="Cevap (şifre yenilemede sorulur)"><small>Cevabı kesin ve doğru yazın; şifrenizi unutursanız bununla yenilersiniz.</small>':''}
  <div class=err>${err}</div><button onclick="${view==='reg'?'reg()':'login()'}" style="width:100%">${view==='reg'?'Kayıt ol':'Giriş yap'}</button>
  <p style=text-align:center onclick="view='${view==='reg'?'login':'reg'}';err='';paint()">${view==='reg'?'Hesabım var':'Yeni hesap oluştur'}</p>${view!=='reg'?`<p style=text-align:center onclick="view='forgot';err='';paint()">Şifremi unuttum</p>`:''}</div>
  <div class=deco id=deco>👫💬😂🎉🤳😍🧑‍🤝‍🧑📱🎈😎💕🎶🥳💬👭😜</div>`;return}
 if(S.locked){a.innerHTML=`<div class=lock><h1 class=logo>Bi Chat’le</h1><p>Kilitli: ${esc(S.me)}</p><input id=p type=password placeholder="Şifre"><div class=err>${err}</div><button onclick=unlock()>Aç</button></div>`;return}
 const u=S.users[S.me];
 let h=`<header><h1 class=logo>Bi Chat’le</h1><button class=g id=umb onclick="menu=!menu;paint()">${u.av} ${esc(S.me)} ▾</button>`;
 if(menu)h+=`<div class=menu><div onclick="sub('prof')">Profil</div><div onclick="sub('pw')">Şifre</div><div onclick="sub('theme')">Tema</div>${isAdm()?`<div onclick="sub('adm')">Kullanıcılar</div>`:''}<div onclick="sub('set')">Ayarlar</div><hr><div onclick=out()>Oturumu kapat</div></div>`;
 h+='</header>';
 if(view==='list'){
  h+=`<div class=pane><div class=box><small>☁️ Hesap ve arkadaş listesi Firebase ile senkronize ediliyor.</small><input id=add placeholder="Kullanıcı adıyla arkadaş ekle"><button onclick=addF()>Ekle</button><div class=err>${err}</div></div>`;
  (u.friends||[]).forEach(f=>{if((u.blocked||[]).includes(f))return;h+=`<div class=row onclick="peer='${f}';view='chat';paint()"><div class=av>${(S.users[f]||{}).av||'🙂'}</div><b>${esc((u.nick||{})[f]||f)}</b></div>`});
  h+=`</div>`}
 else if(view==='chat'){
  const k=key(S.me,peer),ms=S.chats[k]||[];
  h+=`<div style="text-align:center;padding:4px"><button class=g onclick="view='list';paint()">‹ Geri</button> <span class=av style="display:inline-grid;vertical-align:middle">${S.users[peer].av}</span> <b>${esc((u.nick||{})[peer]||peer)}</b> <button class=g onclick=startCall()>📹</button> <button class=g onclick=fm()>⋯</button></div>
  <div class=msgs id=ms>${ms.map(m=>`<div class="m ${m.f===S.me?'me':''} ${m.x&&EMO.test(m.x)?'em':''}"><b>${esc(m.f)}</b>${mediaHtml(m)}${m.v?'📳 Titreşim!':''}${m.k?'👇 Tık tık!':''}${m.au?`<audio controls preload=metadata src='${m.au}' style='max-width:100%'></audio>`:''}${m.b?`<span onclick="bombFx()" style="font-size:44px;cursor:pointer">💣</span><small> Bombaya tıkla!</small>`:''}<div><small onclick="del('${m.id}')">🗑 Sil</small>${m.x?` <small><a href="https://translate.google.com/?sl=auto&tl=tr&text=${encodeURIComponent(m.x)}" target=_blank>Türkçeye çevir</a></small>`:''}</div></div>`).join('')}</div>

 }finally{bclLoggingIn=false;}

mem:g=>{const s=g.st;let h=`<p>${esc(g.pl[0])}: ${s.sc[0]} · ${esc(g.pl[1])}: ${s.sc[1]}</p><div style='display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(94vw,340px);margin:auto'>`;s.c.forEach((x,i)=>{const up=s.m[i]>=0||s.open.includes(i)||s.show.includes(i);h+=`<button class=g style='aspect-ratio:1;font-size:30px;padding:0;${s.m[i]>=0?'opacity:.45':''}' onclick=gmem(${i})>${up?x:'❓'}</button>`});return h+'</div>'},
guess:g=>{const s=g.st;if(s.secret===null)return gMine(g)?`<p>Aklından 1-100 arası bir sayı seç, rakip bulmaya çalışacak:</p><input id=gn type=number min=1 max=100><button onclick=gset()>Belirle</button>`:`<p>${esc(g.pl[0])} bir sayı belirliyor…</p>`;return `<p>1-100 arası sayıyı ${esc(g.pl[1])} tahmin ediyor.</p>`+s.gs.map(x=>`<div>${esc(x.u)}: ${x.n} ${x.n<s.secret?'↑ daha büyük':x.n>s.secret?'↓ daha küçük':'✅ doğru!'}</div>`).join('')+(gMine(g)?`<input id=gn type=number min=1 max=100 placeholder='Tahminin'><button onclick=gset()>Tahmin et</button>`:'')},
dice:g=>{const s=g.st;return `<p>${esc(g.pl[0])}: ${s.sc[0]} · ${esc(g.pl[1])}: ${s.sc[1]} (5 puana kadar)</p><p style='font-size:42px;margin:4px'>${s.r.map(x=>x?DF[x-1]:'▫').join(' ')}</p><p>${esc(s.last)}</p>`+(gMine(g)?`<button onclick=gdice()>🎲 Zar at</button>`:'')}
};
function removeUser(n){delete S.users[n];for(const k in S.users){const u=S.users[k];u.friends=(u.friends||[]).filter(f=>f!==n);u.blocked=(u.blocked||[]).filter(f=>f!==n);if(u.nick)delete u.nick[n]}for(const k in S.chats)if(k.split('|').includes(n))delete S.chats[k];for(const k in S.games||{})if(k.split('|').includes(n))delete S.games[k]}
function selfDel(){const u=S.users[S.me];if(!u)return;if(isAdm())return alert('Yönetici hesabı silinemez.');if(!confirm('Hesabınızı tamamen silmek istediğinize emin misiniz? Tüm sohbetleriniz ve verileriniz silinir.'))return;const p=prompt('Onay için şifrenizi yazın:');if(p!==u.pw)return alert('Şifre yanlış, hesap silinmedi.');if(!confirm('Bu işlem geri alınamaz. Hesabı tamamen silmek istiyor musunuz?'))return;removeUser(S.me);S.me=null;view='login';menu=false;err='';save();paint()}
document.addEventListener('click',e=>{if(menu&&!(e.target.closest&&(e.target.closest('.menu')||e.target.closest('#umb')))){menu=false;paint()}});
let fu=null;
function forgot(){let h=`<div class=box><h1 class=logo>Bi Chat’le</h1><h3>Şifre yenileme</h3>`;if(!fu)h+=`<input id=u placeholder="Kullanıcı adı"><div class=err>${err}</div><button onclick=fNext()>Devam</button>`;else h+=`<p><b>${esc(fu.sq)}</b></p><input id=an placeholder="Cevabınız"><input id=p type=password placeholder="Yeni şifre"><input id=p2 type=password placeholder="Yeni şifre tekrar"><div class=err>${err}</div><button onclick=fDo()>Şifreyi yenile</button>`;h+=`<p style=text-align:center onclick="fu=null;view='login';err='';paint()">‹ Girişe dön</p></div>`;$('#app').innerHTML=h}
function fNext(){const n=$('#u').value.trim().toLowerCase(),u=S.users[n];if(!u)err='Kullanıcı bulunamadı';else if(!u.sq)err='Bu hesapta güvenlik sorusu yok';else{fu={n,sq:u.sq};err=''}paint()}
function fDo(){const u=S.users[fu.n],an=$('#an').value.trim().toLocaleLowerCase('tr'),p=$('#p').value;if(an!==u.sa)return err='Cevap yanlış',paint();if(!okPw(p))return err='Şifre 8 hane; harf+sayı şart, yalnızca harf, sayı, nokta',paint();if(p!==$('#p2').value)return err='Şifreler uyuşmuyor',paint();u.pw=p;fu=null;view='login';err='';save();alert('Şifre yenilendi, giriş yapabilirsiniz');paint()}
const EMO=/^(\p{Extended_Pictographic}|\s|\u200d|\ufe0f)+$/u;
function fly(t){const g=[...t].filter(c=>c.trim()&&c!=='\u200d'&&c!=='\ufe0f');for(let i=0;i<12;i++){const s=document.createElement('span');s.className='fly';s.textContent=g[i%g.length];s.style.left=Math.random()*85+'%';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3200)}}
function mkDeco(){const d=$('#deco');if(!d||d.dataset.k)return;d.dataset.k=1;const tx=d.textContent;let g=(window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(tx)].map(x=>x.segment):[...tx]).filter(s=>s.trim());d.textContent='';g=['😂','😍','🎉','🤳','📱','🎈','😎','💕','🎶','🥳','💬','😜','🤩','🍕','🦄','🌈'];const W=d.clientWidth||360,H=d.clientHeight||400,P=[];[125,96,96,70,70,50,50,50,34,34,34,22,22,22].forEach((z,i)=>{for(let t=0;t<200;t++){const x=Math.random()*(W-z),y=Math.random()*(H-z),c={x:x+z/2,y:y+z/2,r:z*.7};if(P.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<(p.r+c.r)*1.1))continue;P.push(c);const s=document.createElement('span');s.textContent=g[i%g.length];s.style.left=x+'px';s.style.top=y+'px';s.style.fontSize=z+'px';s.style.setProperty('--r',(Math.random()*70-35)+'deg');if(Math.random()<.5){s.className='a'+(Math.random()*2|0);s.style.animationDelay=Math.random()*3+'s'}d.appendChild(s);break}})}
setInterval(()=>{document.querySelectorAll('h1.nope').forEach(h=>[0,1].forEach(side=>{const w=h.offsetWidth,ht=h.offsetHeight,q=(side?1.5708:-1.5708)+Math.random()*3.1416,x=w/2+Math.cos(q)*((w/2-46)*1.12+8),y=ht/2+Math.sin(q)*((ht/2-12)*1.3+8),k=['#ffb300','#ff4081','#29b6f6','#ffd740','#69f0ae'][Math.random()*5|0],c=document.createElement('i');c.className='st';c.textContent='✦';c.style.cssText=`left:${x}px;top:${y}px;--k:${k}`;h.appendChild(c);for(let j=0;j<6;j++){const a=Math.PI*2*j/6+Math.random(),r=3+Math.random()*7,p=document.createElement('i');p.className='sp';p.style.cssText=`left:${x}px;top:${y}px;animation-duration:${.5+Math.random()*.6}s;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;h.appendChild(p);setTimeout(()=>p.remove(),1200)}setTimeout(()=>c.remove(),900)}))},850);
function squig(h,w,ht){const C=['#111','#e53935','#ff9800','#1de9b6','#a5d6a7'];for(let i=0;i<12;i++){const e=document.createElement('i'),q=Math.random()*6.283,x=w/2+Math.cos(q)*((w/2-46)*1.1+Math.random()*30),y=ht/2+Math.sin(q)*((ht/2-12)*1.3+Math.random()*12),c=C[i%5];e.className='sq';e.style.cssText=`left:${x}px;top:${y}px;--a:${Math.random()*180-90}deg;--a2:${Math.random()*180-90}deg;--dx:${Math.random()*40-20}px;--dy:${Math.random()*20-10}px;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;e.innerHTML=`<svg width='26' height='10' viewBox='0 0 26 10'><path d='M1 5q3-6 6 0t6 0 6 0 6 0' fill='none' stroke='${c}' stroke-width='2' stroke-dasharray='5 3' stroke-linecap='round'/></svg>`;h.appendChild(e)}}
function mkRing(){document.querySelectorAll('h1.logo').forEach(h=>{if(h.querySelector('.sq'))return;const w=h.offsetWidth,ht=h.offsetHeight;squig(h,w,ht);const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','ring');s.setAttribute('width',w);s.setAttribute('height',ht);s.innerHTML=`<rect x="26" y="4" width="${w-52}" height="${ht-8}" rx="12"/>`;h.appendChild(s)})}
if(document.fonts)document.fonts.ready.then(()=>{document.querySelectorAll('.ring,.sq').forEach(r=>r.remove());mkRing()});
const _p=paint;paint=function(){_p();mkDeco();mkRing()};
auth.onAuthStateChanged(async user=>{
 bclStopChatWatch();
 if(bclRegistering||bclLoggingIn)return;
 if(user&&user.email&&user.email.endsWith('@bichatle.app')){
  const n=user.email.slice(0,-'@bichatle.app'.length);
  try{
   let profile=null;
   // Auth olayı, kayıt sırasında Firestore profil yazılmadan önce gelebilir; kısa süre tekrar dene.
   for(let i=0;i<6&&!profile;i++){profile=await bclUserDoc(n);if(!profile)await new Promise(r=>setTimeout(r,350));}
   if(!profile){err='Hesap doğrulandı ancak kullanıcı profili Firestore’da bulunamadı. Giriş/kayıt işlemini tekrar deneyin.';S.me=null;view='login';save();paint();return;}
   S.users[n]=profile;S.me=n;S.locked=false;save();bclWatchMe(n);await bclSyncFriends();view='list';
  }catch(e){console.error('Oturum başlatma hatası:',e);err='Profil yüklenemedi ('+(e.code||'hata')+'): '+(e.message||'');view='login';}
 }else{
  if(bclMeUnsub){bclMeUnsub();bclMeUnsub=null;}
  S.me=null;save();
 }
 paint();
});
